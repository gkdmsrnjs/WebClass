<!doctype html>
<html>
  <head>
    <style type="text/css">
      h2,
      h3 {
        font-size: 24px;
      }
      p {
        font-size: 16pt;
      }
      a:link {
        color: blue;
      }
      a:visited {
        color: green;
      }
      h2:before {
        content: '➊ ';
        color: Green;
      }
      h3:before {
        content: '➋ ';
        color: Green;
      }
      h3:after {
        content: ' (ⓒhaeun)';
        font-size: 10pt;
      } /* h3요소의 뒤에 콘텐츠 삽입 */
    </style>
    <title>권하은</title>
    <meta charset="UTF-8" />
  </head>
  <body>
    <h2>HTML &nbsp; &nbsp;시작하기</h2>
    <hr />
    <p>안녕하세요.</p>
    <p>반갑습니다.💩</p>
    <img
      src="https://i.pinimg.com/1200x/11/35/77/11357761454aa7e6c19b84f783e08409.jpg"
      width="300"
    />
    <br />
    <h3>스타일시트 이해하기</h3>
    <hr />
    <p>이 예제는 <strong>CSS</strong>의 개념을 설명합니다.</p>
    <p>
      선택자에 <a href="http://www.w3c.org">가상클래스</a>와
      <a href="https://www.smu.ac.kr">선택자 조합</a>을 적용하여 스타일을
      지정합니다.
    </p>
  </body>
</html>
